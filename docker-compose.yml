services:
  ragtox:
    build: .
    container_name: ragtox
    restart: unless-stopped
    environment:
      RAGTOX_BIND: 0.0.0.0
      RAGTOX_PORT: 8767
      RAGTOX_READONLY: 1
      RAGTOX_ALLOWED_HOSTS: ragtox.pedrojuezmartel.com
      RAGTOX_ALLOWED_ORIGINS: https://ragtox.pedrojuezmartel.com
      # La clave nunca va en la imagen: se lee del .env del servidor
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      # Solo accesible desde el propio servidor; Caddy lo publica con HTTPS.
      - "127.0.0.1:8767:8767"
    mem_limit: 512m
